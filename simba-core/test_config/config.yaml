# yaml-language-server: $schema=../../config.schema.json
log:
  log_level: {type: Debug}
    # type: Internal
    # value: [type: All]
time_analysis:
  exporter: 
    type: TraceEventExporter
  output_path: "time_performance"
results: {} #default results
max_time: 60.
random_seed: 85646513.6849618
environment:
  map_path: "maps/landmarks_square.yaml"
robots:
  - name: "robot1"
    navigator: 
      type: TrajectoryFollower
      trajectory_path: "paths/path1.yaml"
      target_speed: 0.5
      forward_distance: 0.2
    controller:
      type: PID
      proportional_gains: [1.0, 6.0]
    sensor_manager:
      sensors:
        - name: "RobotSensor"
          send_to: ["Central Unit"]
          config:
            type: Robot
            activation_time: 
              period: {type: Num, value: 0.1}
            detection_distance: 100.0
        - name: "LandmarkSensor"
          config: 
            type: OrientedLandmark
            detection_distance: 10.0
            faults:
              - type: AdditiveRobotCentered # Gaussian White Noise
                variable_order: [x, y, orientation]
                distributions:
                  - type: Normal
                    mean: [0, 0, 0]
                    covariance: [0.01, 0, 0, 0, 0.01, 0, 0, 0, 0.01]
        - name: "SpeedSensor"
          config:
            type: Speed
            activation_time: 
              period: {type: Num, value: 0.1}
            faults:
              - type: Additive
                variable_order: [v, w]
                distributions:
                  - type: Normal
                    mean: [0, 0]
                    covariance: [0.01, 0, 0, 0.01]
        - name: "DisplacementSensor"
          config:
            type: Displacement
            activation_time: 
              period: {type: Num, value: 0.1}
            faults:
              - type: AdditivePreDisplacement
                variable_order: [x, y, rotation]
                distributions:
                  - type: Normal
                    mean: [0, 0, 0]
                    covariance: [0.01, 0, 0, 0, 0.01, 0, 0, 0, 0.01]
        - name: "LidarSensor"
          config:
            type: Scan
            activation_time: 
              period: {type: Num, value: 0.1}
            detection_distance: 100
            rays: 
              type: Regular
              value: 1000
            faults:
              - type: PointAdditiveRobotCentered
                variable_order: [r, theta]
                distributions:
                  - type: Normal
                    mean: [0, 0]
                    covariance: [0.1, 0, 0, 0.01]                    
  - name: "robot2"
    navigator:
      type: TrajectoryFollower
      trajectory_path: "paths/path1.yaml"
      target_speed: 0.3
      forward_distance: 0.2
    physics: 
      type: Internal
      model:
        type: Holonomic
    controller: 
      type: PID
      proportional_gains: [1.0, 3.0]
    sensor_manager:
      sensors:
        - name: "RobotSensor"
          send_to: ["Central Unit"]
          config: 
            type: Robot
            activation_time: 
              period: {type: Num, value: 0.1}
            detection_distance: 100.0
  - name: "robot3"
    navigator:
      type: TrajectoryFollower
      trajectory_path: "paths/path1.yaml"
      target_speed: 0.3
      forward_distance: 0.2
    physics: 
      type: Internal
      model:
        type: Holonomic
      initial_state:
        pose: [10, 10, 0]
    controller: 
      type: PID
      proportional_gains: [1.0, 3.0]
computation_units:
  - name: "Central Unit"
    network:
      reception_delay: 0.
    state_estimators:
      - name: "central_perfect"
        config: 
          type: Perfect
          targets: ["robot1", "robot2", "robot3"]
          prediction_activation:
            period: {type: Num, value: 0.1}
